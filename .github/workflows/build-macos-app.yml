name: Build macOS App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build universal app
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run core tests
        run: swift run BrightnessControlCoreTestRunner

      - name: Set app version
        shell: bash
        run: |
          app_version="1.0.0"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
            app_version="${app_version%%-*}"
          fi

          if [[ ! "$app_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Tag must use a version such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build Intel and Apple Silicon app
        run: ./build_app.sh --arch arm64 --arch x86_64

      - name: Verify app bundle
        shell: bash
        run: |
          app_path=".build/apple/Products/Release/Brightness Control.app"
          executable="$app_path/Contents/MacOS/BrightnessControlApp"

          plutil -lint "$app_path/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo "$executable" -verify_arch arm64 x86_64

      - name: Create distributable archive
        shell: bash
        run: |
          mkdir -p dist
          archive_name="Brightness-Control-${APP_VERSION}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            ".build/apple/Products/Release/Brightness Control.app" \
            "dist/$archive_name"
          (
            cd dist
            shasum -a 256 "$archive_name" > "$archive_name.sha256"
          )

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brightness-Control-macOS-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: Brightness-Control-macOS-universal
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes
          fi
